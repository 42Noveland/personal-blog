# /etc/nginx/conf.d/blog-location.conf —— 片段：挂到已有的 2270(TLS) 服务块里
# 用法：把下面 location 段追加到 /etc/nginx/conf.d/dsh.conf 的 server{ } 内，然后 nginx -t && systemctl reload nginx
#
# 注意：proxy_pass 结尾带 / 表示把 /blog/ 前缀剥掉再转发，
#       服务端 config.json 里的 basePath 需为 "/blog" 才能生成正确链接。

    # 博客（Node 服务，监听 127.0.0.1:3081）
    location = /blog {
        return 301 /blog/;
    }

    location /blog/ {
        proxy_pass http://127.0.0.1:3081/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /blog;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
